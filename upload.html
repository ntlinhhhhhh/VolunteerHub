<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Create Event</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        textarea { width: 100%; font-family: monospace; }
        .form-group { margin-bottom: 15px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
    </style>
</head>

<body>
    <h2>Upload Event API Test (Multipart/Form-data)</h2>

    <form id="eventForm">
        <div class="form-group">
            <label><strong>1. JSON Body (Dữ liệu sự kiện):</strong></label><br>
            <textarea id="jsonData" rows="15">
{
  "title": "Workshop 'Màu Sắc Cho Cuộc Sống'",
  "description": "Tổ chức chuỗi buổi vẽ tranh và thủ công cho trẻ em khuyết tật. Mục tiêu là tạo ra môi trường sáng tạo, hỗ trợ phát triển kỹ năng tinh thần và vận động cho các em, sau đó tổ chức bán đấu giá tác phẩm để gây quỹ.",
  "categoryId": "693ba2b044dddc2c4c68bba4",
  "location": {
    "address": "Trung tâm phục hồi chức năng người khuyết tật Hà Nội",
    "city": "Hà Nội",
    "district": "Thanh Xuân"
  },
  "schedule": {
    "startDate": "2025-12-12T17:00:00.000Z",
    "endDate": "2025-12-12T18:00:00.000Z",
    "registrationDeadline": "2025-12-12T16:00:00.000Z"
  },
  "requirements": {
    "minAge": 16,
    "maxAge": 50,
    "skills": ["Kỹ năng hội họa cơ bản", "Kiên nhẫn", "Làm việc với trẻ em đặc biệt"],
    "experience": "Ưu tiên sinh viên ngành nghệ thuật, sư phạm hoặc công tác xã hội",
    "healthRequirements": "Sức khỏe tốt"
  },
  "capacity": {
    "maxVolunteers": 30,
    "minVolunteers": 15
  },
  "roles": [
    { "name": "Giáo viên mỹ thuật", "description": "Hướng dẫn kỹ thuật vẽ và tổ chức lớp học", "slots": 5 },
    { "name": "Trợ lý hỗ trợ cá nhân", "description": "Giúp đỡ các em khuyết tật trong quá trình tham gia", "slots": 20 },
    { "name": "Hậu cần và Tổ chức đấu giá", "description": "Chuẩn bị vật liệu, địa điểm và tổ chức sự kiện gây quỹ", "slots": 5 }
  ],
  "images": [],
  "videos": [],
  "visibility": "public",
  "tags": ["nghệ thuật", "người khuyết tật", "gây quỹ", "trẻ em"]
}
            </textarea>
        </div>

        <div class="form-group">
            <label><strong>2. Upload Images (Chọn nhiều ảnh):</strong></label><br>
            <input type="file" name="images" multiple accept="image/*">
        </div>

        <div class="form-group">
            <label><strong>3. Token (Bearer):</strong></label><br>
            <input type="text" id="token" style="width: 100%;" value="YOUR_TOKEN_HERE" placeholder="Paste your JWT Token here">
        </div>

        <button type="button" onclick="sendData()">Gửi Request</button>
    </form>

    <h3>Response:</h3>
    <pre id="responseOutput">...</pre>

    <script>
        // Hàm đệ quy để chuyển Object/Array thành FormData key (flatten)
        // Ví dụ: location: { city: "HN" } -> location[city]: "HN"
        function objectToFormData(obj, form, namespace) {
            const fd = form || new FormData();
            let formKey;

            for (const property in obj) {
                if (obj.hasOwnProperty(property)) {
                    if (namespace) {
                        // Tạo key dạng parent[child]
                        formKey = namespace + '[' + property + ']';
                    } else {
                        formKey = property;
                    }

                    // Nếu là object (và không phải File hay Date) thì đệ quy tiếp
                    if (typeof obj[property] === 'object' && !(obj[property] instanceof File) && !(obj[property] instanceof Date)) {
                        objectToFormData(obj[property], fd, formKey);
                    } else {
                        // Nếu là giá trị đơn hoặc Date, append vào
                        const value = obj[property] instanceof Date ? obj[property].toISOString() : obj[property];
                        fd.append(formKey, value);
                    }
                }
            }
            return fd;
        }

        async function sendData() {
            const output = document.getElementById("responseOutput");
            output.textContent = "Đang gửi...";
            
            // 1. Lấy JSON
            const jsonText = document.getElementById("jsonData").value;
            let payload;
            try {
                payload = JSON.parse(jsonText);
            } catch (e) {
                alert("Lỗi: JSON không đúng định dạng!");
                return;
            }

            // 2. Khởi tạo FormData
            const formData = new FormData();

            // 3. Chuyển JSON thành FormData phẳng (QUAN TRỌNG)
            objectToFormData(payload, formData);

            // 4. Append file ảnh thủ công
            const imageInput = document.querySelector('input[name="images"]');
            if (imageInput.files.length > 0) {
                for (let i = 0; i < imageInput.files.length; i++) {
                    formData.append("images", imageInput.files[i]);
                }
            }

            // 5. Lấy Token
            const token = document.getElementById("token").value;

            // 6. Gửi Request
            try {
                // Lưu ý: Kiểm tra lại Port (3000 hay 8000)
                const response = await fetch("http://localhost:8000/events", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token
                        // Không được set Content-Type thủ công! 
                        // Fetch tự động set là multipart/form-data kèm boundary
                    },
                    body: formData
                });

                const result = await response.json();
                console.log(result);
                output.textContent = JSON.stringify(result, null, 2);
                
                if (response.ok) {
                    alert("Thành công!");
                } else {
                    alert("Lỗi: " + (result.message || "Unknown error"));
                }
            } catch (error) {
                console.error(error);
                output.textContent = "Lỗi kết nối: " + error.message;
            }
        }
    </script>
</body>
</html>
