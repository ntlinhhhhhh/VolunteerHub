networks:
  test-net:
    driver: bridge

services:
  mongo:
    image: mongo:6
    container_name: test-mongo
    ports:
      - "27018:27017"
    networks:
      - test-net
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: test-redis
    ports:
      - "6380:6379"
    networks:
      - test-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: test-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - test-net
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-test-data:/var/lib/rabbitmq

  communication-service-test:
    build:
      context: ..
      dockerfile: communication-service/Dockerfile.test
    container_name: communication-service-test
    env_file:
      - .env
    networks:
      - test-net
    depends_on:
      - mongo
      - redis
      - rabbitmq
    environment:
      MONGO_URI: mongodb://mongo:27017/communication-service-test
      REDIS_URL: redis://redis:6379

volumes:
  rabbitmq-test-data: