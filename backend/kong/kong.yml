_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-service:4000
    routes:
      - name: auth-route
        paths:
          - /auth
          - /auth/*
        preserve_host: true
        strip_path: false

  - name: user-service
    url: http://user-service:4002
    routes:
      - name: user-route
        paths:
          - /users
        strip_path: false

  - name: notification-service
    url: http://notification-service:4004
    routes:
      - name: notification-route
        paths:
          - /notification
        strip_path: false
    
  - name: event-service
    url: http://event-service:4004
    routes:
      - name: event-route
        paths:
          - /events
        strip_path: false
