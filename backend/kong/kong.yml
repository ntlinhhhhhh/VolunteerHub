_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-service:4000
    routes:
      - name: auth-route
        paths:
          - /auth
          - /auth/*
        preserve_host: true
        strip_path: false

  - name: user-service
    url: http://user-service:4002
    routes:
      - name: user-route
        paths:
          - /users
          - /uploads/avatars
        strip_path: false

  - name: notification-service
    url: http://notification-service:4004
    routes:
      - name: notification-route
        paths:
          - /notification
        strip_path: false
    
  - name: event-service
    url: http://event-service:4006
    routes:
      - name: event-route
        paths:
          - /events
          - /categories
          - /uploads/events
        strip_path: false

  - name: event-registration-service
    url: http://event-registration-service:4008
    routes:
      - name: event-registration-route
        paths:
          - /registrations
        strip_path: false
  - name: communication-service
    url: http://communication-service:4010
    routes:
      - name: communication-route
        paths:
          - ~/events/([^/]+)/posts
          - /uploads/posts

        strip_path: false

  - name: dashboard-service
    url: http://dashboard-service:4012
    routes:
      - name: dashboard-route
        paths:
          - /dashboard
        strip_path: false


