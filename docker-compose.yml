version: '3.9'

networks:
  volunteerhub-net:
    driver: bridge

services:
  # MongoDB cho Auth-service
  mongo:
    image: mongo:6
    container_name: volunteer-mongo
    ports:
      - "27017:27017"
    networks:
      - volunteerhub-net
    restart: unless-stopped

  # Auth-service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      MONGO_URI: mongodb://volunteer-mongo:27017/auth-service
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    networks:
      - volunteerhub-net
    restart: unless-stopped

  # Postgres cho Kong
  kong-database:
    image: postgres:13
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    ports:
      - "5432:5432"
    networks:
      - volunteerhub-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Chạy migrations cho Kong
  kong-migrations:
    image: kong:3.3.0
    container_name: kong-migrations
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    command: >
      sh -c "kong migrations bootstrap && kong migrations up && kong migrations finish"
    networks:
      - volunteerhub-net
    restart: "no"

  # Kong Gateway
  kong:
    image: kong:3.3.0
    container_name: kong
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    ports:
      - "8000:8000"   # proxy
      - "8001:8001"   # admin
    networks:
      - volunteerhub-net
    restart: unless-stopped
